[project]
name = "ocom"
description = "A unified TUI for managing network/privacy tools: OpenVPN, SpoofDPI, Cloudflare WARP"
license = "MIT"
readme = "README.md"
authors = [{ name = "Hasan Sezer Tasan", email = "hasansezertasan@gmail.com" }]
maintainers = [
  { name = "Hasan Sezer Tasan", email = "hasansezertasan@gmail.com" },
]
dynamic = ["version"]
keywords = [
  "tui",
  "vpn",
  "openvpn",
  "warp",
  "spoofdpi",
  "goodbyedpi",
  "network",
  "privacy",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python",
  "Topic :: Internet",
  "Topic :: System :: Networking",
  "Typing :: Typed",
]
requires-python = ">=3.14"
dependencies = [
  "textual==8.2.8",
  "rich==15.0.0",
  "pydantic-settings[toml]==2.14.2",
]

[project.optional-dependencies]


all = []

[project.scripts]
ocom = "ocom.__main__:main"


[project.urls]
changelog = "https://github.com/hasansezertasan/ocom/blob/main/CHANGELOG.md"
documentation = "https://hasansezertasan.github.io/ocom"
homepage = "https://github.com/hasansezertasan/ocom"
issues = "https://github.com/hasansezertasan/ocom/issues"
releasenotes = "https://github.com/hasansezertasan/ocom/releases"
source = "https://github.com/hasansezertasan/ocom.git"


[dependency-groups]
dev = [
  "ocom[all]",
  "tox==4.58.0",
  "tox-uv==1.36.0",
  "debugpy==1.8.21",
  { include-group = "style" },
  { include-group = "test" },
]
style = [
  "actionlint-py==1.7.12.24",
  "basedpyright==1.39.9",
  "editorconfig-checker==3.8.0",
  "import-linter==2.13",
  "mypy==2.3.0",
  "pyrefly==1.2.0",
  "ruff==0.16.1",
  "slotscheck==0.20.1",
  "sphinx-lint==1.0.2",
  "taplo==0.9.3",
  "ty==0.0.69",
  "typos==1.49.0",
  "validate-pyproject[all]==0.25",
  "vulture==2.16",
  "zuban==0.9.1",
  # "google-yamlfmt",
  # "shellcheck-makefile>=1.27.3",
  # "shellcheck-py>=0.10.0.1",
  # "types-PyYAML",
  # "types-setuptools",
  # "types-ujson",
  # "yamlfix>=1.18.0",
  # "yamlfmt>=1.1.1",
  # "yamllint>=1.37.1",
]
test = [
  "coverage-enable-subprocess==1.0",
  "coverage[toml]==7.15.3",
  "pytest-mock==3.15.1",
  "pytest-rerunfailures==16.4",
  "pytest-xdist[psutil]==3.8.0",
  "pytest==8.4.2",
  "pytest-sugar",
  "pytest-asyncio>=0.23.0",
  "dirty-equals",
  "inline-snapshot",
]
docs = [
  "sphinx==8.2.3",
  "shibuya==2026.7.12",
  "sphinx-autobuild==2024.10.3",
  "sphinx-copybutton==0.5.2",
  "sphinx-design==0.7.0",
  "sphinx-togglebutton==0.4.5",
  "sphinx-paramlinks==0.6.0",
  "auto-pytabs[sphinx]==0.5.0",
  "myst-parser==4.0.1",
]
tool = [
  "commitizen==4.17.0",
  # "marimo==0.15.2",
  # "inflection==0.5.1",
  # "copier==9.11.0",
]
prek = ["prek==0.4.12"]


[build-system]

requires = ["hatchling", "hatch-vcs"]

build-backend = "hatchling.build"


[tool.uv]
add-bounds = "exact"
cache-keys = [
  { file = "pyproject.toml" },
  { git = { commit = true, tags = true } },
]
package = true
trusted-publishing = "always"


[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0"


[tool.hatch.build]
hooks.vcs.version-file = "src/ocom/_version.py"


[tool.hatch.version.raw-options]
version_scheme = "only-version"
local_scheme = "no-local-version"

[tool.hatch.metadata]
allow-direct-references = true


[tool.hatch.build.targets.sdist]
# The package uses a src layout, so the source tree lives under /src (not
# /ocom); including /src ships the actual modules -- and, for
# C-extension projects, the .pyx/.pxd sources needed to compile from the sdist.
include = ["/README.md", "LICENSE", "/src", "/tests"]


[tool.commitizen]
# Commit-authoring and message linting only. release-please owns version
# bumping, git tagging, and CHANGELOG.md (see .github/release-please-config.json),
# so the bump/tag/changelog settings are intentionally omitted here to avoid two
# tools competing over the same tags and changelog file.
name = "cz_conventional_commits"

[tool.pytest.ini_options]
# addopts = "-rXs --strict-config --strict-markers"
addopts = "-v --tb=short"
asyncio_mode = "auto"
filterwarnings = ["error"]
testpaths = ["tests"]
xfail_strict = true


[tool.coverage.run]
branch = true
# Match `_version.py` wherever it resolves: `src/...` in editable dev installs and
# `.../site-packages/...` when tox/CI installs the built wheel or sdist. A
# `src/**`-only pattern silently misses the installed copy and reports it at 0%.
omit = ["*/_version.py"]
parallel = true
source_pkgs = ["ocom", "tests"]


[tool.coverage.paths]
# Unify coverage data across environments. tox installs the built wheel/sdist into
# each env's site-packages, so the same source file is measured under a different
# `.tox/<env>/.../site-packages/ocom` path per interpreter. Without
# remapping those back to the canonical `src/` tree, `coverage combine` keeps a
# separate copy per env and a version-gated line covered in one interpreter but not
# another is wrongly counted as missed — silently failing the `fail_under` gate.
# `tests` needs no remapping: it is never installed, so every environment measures
# it at the same repo-local path.
ocom = ["src/ocom", "*/site-packages/ocom"]


[tool.coverage.report]
# Untestable code is excluded per site with `# pragma: no cover`, not with blanket
# patterns here: a regex matching a `def` line excludes the *whole function body*,
# so a pattern like `def main\(` would silently un-measure any future `main()`
# with real logic (and did mask the tested GUI/TUI entrypoints). Pragmas carry the
# exclusion decision next to the code it affects. See ADR-008.
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]
fail_under = 99
# Patterns match both the `src/` (editable) and installed (`site-packages`)
# layouts (see [tool.coverage.run] omit).
omit = ["*/_version.py"]
show_missing = true
skip_covered = true


[tool.vulture]
# Framework-invoked handlers: Typer commands, FastAPI routes, FastStream
# lifecycle hooks, and the MCP tool dispatcher.
ignore_decorators = [
  "@app.command",
  "@app.get",
  "@app.after_startup",
  "@app.after_shutdown",
  "@server.call_tool",
  # pytest invokes fixtures (esp. autouse ones) by injection, never by name.
  "@pytest.fixture",
]
# Public API surfaces vulture cannot see being used: ``main`` entry points are
# referenced only via pyproject scripts, ``model_config`` is consumed by
# pydantic-settings, ``logger`` is imported only by optional components, the MCP
# ``arguments`` parameter is mandated by the call_tool signature, the Textual
# names (CSS/compose/on_mount/title/BINDINGS) are invoked by the TUI framework,
# and ``pytestmark`` is consumed by pytest at collection time. The glob entries
# cover Textual's dynamically-dispatched callbacks (``on_*`` message handlers,
# ``watch_*`` reactives, ``action_*`` bindings).
ignore_names = [
  "CONFIG_FILE_PATH",
  "logger",
  "main",
  "model_config",
  "compose",
  "on_*",
  "watch_*",
  "action_*",
  "BINDINGS",
  "CSS",
  "DEFAULT_CSS",
  # Textual App title/subtitle class vars and Button properties written on
  # widgets (vulture cannot see the framework read them).
  "TITLE",
  "SUB_TITLE",
  "disabled",
  "label",
  "variant",
  # pydantic-settings calls this override by name with keyword-mandated params.
  "settings_customise_sources",
  "env_settings",
  "dotenv_settings",
  "file_secret_settings",
]
min_confidence = 60
paths = ["src", "tests"]


[tool.typos.default]
# Git commit SHAs — e.g. in the release-please-owned CHANGELOG.md links — are
# identifiers, not prose, and must not be spell-checked.
extend-ignore-re = ['\b[0-9a-f]{7,40}\b']


[tool.slotscheck]
strict-imports = false


[tool.importlinter]
root_package = "ocom"


[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
# Layers are listed high -> low: a layer may import lower layers but never a
# higher one. The Textual UI (screens/widgets) orchestrates the tool
# implementations, which build on the shared `core` abstractions
# (BaseTool/ProcessManager). `config` and `app` are left outside the contract as
# unconstrained top-level modules.
layers = ["ocom.tui", "ocom.tools", "ocom.core"]


[tool.ruff]
fix = true
output-format = "full"
preview = true
show-fixes = true
src = ["src", "tests", "examples"]
target-version = "py314"
unsafe-fixes = true


[tool.ruff.analyze]
detect-string-imports = true
preview = true


[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
preview = true
skip-magic-trailing-comma = true


[tool.ruff.lint]
fixable = ["ALL"]
ignore = ["missing-trailing-comma", "CPY", "FIX", "TD"]
logger-objects = ["logging_setup.logger"]
preview = true
select = ["ALL"]

[tool.ruff.lint.isort]
combine-as-imports = true
# skip-magic-trailing-comma = true
split-on-trailing-comma = false

[tool.ruff.lint.flake8-copyright]
author = "Hasan Sezer Tasan <hasansezertasan@gmail.com>"


[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"


[tool.ruff.lint.mccabe]
max-complexity = 5


[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true


[tool.ruff.lint.pydocstyle]
convention = "pep257"


[tool.ruff.lint.per-file-ignores]
# Recursive glob so nested test packages (tests/cli, tests/gui, ...) are covered.
# Tests legitimately use asserts/magic values, reach into package internals, and
# don't need return-value documentation on their fixtures and helpers. The extra
# codes below are test-idiomatic: pytest groups tests as methods that don't use
# `self` (PLR6301), tests inspect private state (SLF001), pass positional bools
# (FBT001/FBT002), leave fixture/lambda args unused (ARG002/ARG005), stub async
# helpers without awaits (RUF029), define class-level fixtures data (RUF012),
# compare against "" (PLC1901), and don't need full docstrings (D102/D107).
"tests/**/*.py" = [
  "assert",
  "magic-value-comparison",
  "import-private-name",
  "docstring-missing-returns",
  "no-self-use",
  "private-member-access",
  "boolean-type-hint-positional-argument",
  "boolean-default-value-positional-argument",
  "unused-method-argument",
  "unused-lambda-argument",
  "unused-async",
  "mutable-class-default",
  "compare-to-empty-string",
  "undocumented-public-method",
  "undocumented-public-init",
]
# Recursive so nested standalone example dirs (examples/simple, examples/advanced)
# are covered — they are not importable packages.
"examples/**/*.py" = ["implicit-namespace-package"]
# The Sphinx config is a standalone module (INP001), and `copyright` is a
# mandatory Sphinx conf variable name that shadows the builtin (A001).
"docs/conf.py" = ["implicit-namespace-package", "builtin-variable-shadowing"]
# Package __init__ modules deliberately carry logic beyond re-exports: the top
# package resolves the version from hatch-vcs, and tools/__init__ exposes the
# `get_all_tools()` registry factory.
"**/__init__.py" = ["non-empty-init-module"]


[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true


[tool.ruff.lint.ruff]
parenthesize-tuple-in-subscript = true


[tool.mypy]
files = ["src"]
# Pin the analysis platform so the type checkers behave identically on every CI
# OS (macOS/Linux/Windows). Without this, mypy on Windows rejects the Unix-only
# `os.getuid()` in is_admin()'s non-Windows branch, while non-Windows checkers
# reject the Windows-only ctypes.windll branch.
platform = "linux"
pretty = true
python_version = "3.14"
strict = true


[tool.basedpyright]
exclude = [".venv"]
include = ["src/ocom"]
# See [tool.mypy].platform — pin the platform for cross-OS-consistent analysis.
pythonPlatform = "Linux"
pythonVersion = "3.14"
# Textual exposes a fluent/builder API whose calls return values (mounted
# widgets, AwaitMount, Worker, the bool from add_class/remove_class, etc.) that
# are intentionally discarded. Assigning every one to `_` is noise, not quality,
# in a framework UI app, so this one rule is relaxed here rather than in source.
reportUnusedCallResult = false
venv = ".venv"
# venvPath is the directory *containing* the venv, not the venv itself; ".venv"
# here would make basedpyright look for ".venv/.venv". Use "." so both the venv
# and basedpyright's strict ruleset resolve the project's installed deps.
venvPath = "."


[tool.ty.src]
include = ["src", "tests"]
respect-ignore-files = false


[tool.ty.environment]
# See [tool.mypy].platform — pin the platform for cross-OS-consistent analysis.
python-platform = "linux"
python-version = "3.14"


[tool.ty.terminal]
error-on-warning = true


[tool.pyrefly]
# See [tool.mypy].platform — pin the platform for cross-OS-consistent analysis.
python-platform = "linux"
python-version = "3.14"
project-includes = ["src"]

[tool.tox]
# The ``worker`` env is intentionally omitted: it starts a broker-bound process
# and would hang/fail under ``tox run`` in CI (where no broker is available).
# The worker is covered by its pytest TestBroker suite; run it on demand with
# ``tox -e worker`` when a broker is up (e.g. inside the devcontainer).
env_list = ["style", "3.14"]
requires = ["tox>=4"]


[tool.tox.env_run_base]
commands = [
  [
    "coverage",
    "run",
    "--module",
    "pytest",
    "-v",
    "--tb=short",
    "--basetemp={env_tmp_dir}",
    { replace = "posargs", default = [
    ], extend = true },
  ],
]
constrain_package_deps = true
dependency_groups = ["test"]
description = "Run the tests under {base_python}"
env_tmp_dir = "{toxworkdir}/tmp/{envname}"
# Arms coverage-enable-subprocess so xdist/subprocess workers are measured too;
# `coverage run` plus `parallel = true` writes per-env data files that the CI
# `coverage combine` step merges.
set_env = { COVERAGE_PROCESS_START = "{tox_root}/pyproject.toml" }
extras = ["all"]

package = "wheel"

runner = "uv-venv-runner"
use_frozen_constraints = true
wheel_build_env = ".pkg"


[tool.tox.env.style]
base_python = ["3.14"]
commands = [
  ["ruff", "check", "--no-fix"],
  ["ruff", "format", "--check", "--diff"],
  ["mypy", "--python-version", "3.14"],
  ["basedpyright"],
  ["ty", "check"],
  ["pyrefly", "check"],
  ["zuban", "check", "src"],
  ["vulture"],
  ["python", "-m", "slotscheck", "src"],
  ["lint-imports"],
  ["taplo", "lint", "*.toml"],
  # NOTE: kept in fix mode (not `--check`) because the rendered TOML is not yet
  # guaranteed taplo-formatted across every component combination. The `*.toml`
  # glob is non-recursive, so it scopes taplo to this project's own root TOML
  # (pyproject/prek/mise) without walking vendored `.tox`/`.venv`/site-packages
  # trees — no `.taplo.toml` exclude config needed. Making this a strict
  # `--check` gate is a follow-up that first requires the generated
  # pyproject/prek to be clean.
  ["taplo", "format", "*.toml"],
  ["validate-pyproject", "pyproject.toml"],
  ["typos", "--diff"],
  ["actionlint"],
  ["ec"],
  ["sphinx-lint", "docs"],
  # ["yamlfmt", "."],
]
# `test` is included so the type checkers that scope tests (e.g. ty) can
# resolve pytest and other test-only imports.
dependency_groups = ["style", "test"]
description = "Run Checkers, Linters and Formatters"
runner = "uv-venv-runner"


[tool.tox.env.prek]
commands = [["prek", "run", "--all-files"]]
dependency_groups = ["prek"]
description = "Run prek hooks"
runner = "uv-venv-runner"


[tool.tox.env.docs-build]
commands = [["sphinx-build", "-b", "html", "docs", "docs/_build/html"]]
extras = ["all"]
dependency_groups = ["docs"]
description = "Build Docs"
runner = "uv-venv-runner"


[tool.tox.env.docs-server]
commands = [["sphinx-autobuild", "docs", "docs/_build/html"]]
extras = ["all"]
dependency_groups = ["docs"]
description = "Start the live-reloading docs server"
runner = "uv-venv-runner"


[tool.tox.env.docs-linkcheck]
# On-demand link checker. Also run weekly (non-blocking) by docs-linkcheck.yml.
# Hits the network, so it is deliberately not part of the `style` env or PR CI.
commands = [
  [
    "sphinx-build",
    "-b",
    "linkcheck",
    "docs",
    "docs/_build/linkcheck",
  ],
]
extras = ["all"]
dependency_groups = ["docs"]
description = "Check documentation for broken links"
runner = "uv-venv-runner"
